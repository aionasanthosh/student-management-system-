<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub | Login</title><link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark">SH</div><p class="eyebrow">WELCOME BACK</p><h1>Sign in to StudentHub</h1>
    <p class="muted">A simple student management portal.</p>
    <form id="loginForm">
      <label>Email address<input id="loginEmail" type="email" placeholder="student@example.com" required></label>
      <label>Password<input id="loginPassword" type="password" placeholder="Enter any password" required></label>
      <button class="btn full" type="submit">Login</button>
    </form>
    <p class="auth-note">Demo project: any valid email and non-empty password will work.</p>
    <p class="center">New here? <a href="signup.html">Create an account</a></p>
  </main>
  <script src="js/app.js"></script>
</body></html>
