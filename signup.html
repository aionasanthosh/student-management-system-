<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>StudentHub | Sign up</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><main class="auth-card">
<div class="brand-mark">SH</div><p class="eyebrow">GET STARTED</p><h1>Create your account</h1><p class="muted">Join the StudentHub demo portal.</p>
<form id="signupForm"><label>Full name<input id="signupName" type="text" placeholder="Your name" required></label><label>Email address<input id="signupEmail" type="email" placeholder="you@example.com" required></label><label>Password<input id="signupPassword" type="password" minlength="4" placeholder="At least 4 characters" required></label><button class="btn full" type="submit">Create account</button></form>
<p class="center">Already registered? <a href="index.html">Login</a></p>
</main><script src="js/app.js"></script></body></html>
